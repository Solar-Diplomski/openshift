apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-api-gateway
  namespace: solar
  labels:
    app: solar-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-api-gateway
  template:
    metadata:
      annotations:
        image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"solar-api-gateway:latest","namespace":"solar"},"fieldPath":"spec.containers[?(@.name==\"solar-api-gateway\")].image"}]'
        sidecar.istio.io/inject: "true"
      labels:
        app: solar-api-gateway
    spec:
      containers:
        - name: solar-api-gateway
          image: image-registry.openshift-image-registry.svc:5000/solar/solar-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: gateway-jwt-secret
          env:
            - name: CLOUD_GATEWAY_LOG_LEVEL
              value: INFO
            - name: SECURITY_LOG_LEVEL
              value: INFO
            - name: WEB_APPLICATION_TYPE
              value: reactive
            - name: GATEWAY_DISCOVERY_LOCATOR_ENABLE
              value: "true"
            - name: GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID
              value: "true"
            - name: INCLUDE_ENDPOINTS_WEB_EXPOSURE
              value: "health,info"
            - name: ENDPOINT_HEALTH
              value: always
            - name: ALLOW_BEAN_DEFINITION_OVERRIDING
              value: "true"
            - name: MOCK_FLASK_URI
              value: http://solar-ui-api
            - name: MODEL_MANAGEMENT_URI
              value: http://solar-model-management
            - name: USER_MANAGEMENT_URI
              value: http://solar-user-management
            - name: PREDICTION_SERVICE_URI
              value: http://solar-prediction
            - name: CORS_ALLOWED_HOSTS
              value: "https://solar-frontend-solar.apps.okd.fh.zvne.fer.hr,http://localhost:5173"
      triggers:
        - type: ImageChange
          imageChangeParams:
            automatic: true
            containerNames:
              - solar-api-gateway
            from:
              kind: ImageStreamTag
              name: solar-api-gateway:latest
              namespace: solar