apiVersion: apps/v1
kind: Deployment
metadata:
  name: solar-prediction
  namespace: solar
  labels:
    app: solar-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solar-prediction
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app: solar-prediction
    spec:
      containers:
        - name: solar-prediction
          image: image-registry.openshift-image-registry.svc:5000/solar/solar-prediction:latest
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_MANAGER_BASE_URL
              value: http://solar-model-management
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5