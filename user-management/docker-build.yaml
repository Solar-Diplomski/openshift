apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: user-management-docker-build
  namespace: solar-build
spec:
  securityContext:
    runAsNonRoot: true
    fsGroup: 1000730000
  source:
    type: Git
    git:
      uri: "https://github.com/Solar-Diplomski/solar-user-management.git"
      ref: "prod"
  strategy:
    type: Docker # OKD is missing S2I builder image for OpenJDK 21 so Dockerfile is used
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: "solar-user-management:latest"
      namespace: solar