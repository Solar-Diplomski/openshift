apiVersion: v1
kind: Service
metadata:
  name: solar-frontend
  namespace: solar
spec:
  selector:
    app: solar-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5173
type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: solar-frontend
  namespace: solar
spec:
  to:
    kind: Service
    name: solar-frontend
  port:
    targetPort: 5173
  tls:
    termination: edge
