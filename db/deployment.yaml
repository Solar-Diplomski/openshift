apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: solar
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: image-registry.openshift-image-registry.svc:5000/solar/okd-timescaledb:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000730000
      volumes:
          - name: postgres-data
            persistentVolumeClaim:
              claimName: postgres-pvc  


